name: Deploy Supabase Migrations

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/supabase_migrations.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Apply Database Migrations
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Validate Secrets & Configuration
        run: |
          echo "=========================================================="
          echo "Starting Supabase Migration CI/CD Pipeline"
          echo "Target Project ID: ${{ secrets.SUPABASE_PROJECT_ID || 'fvpfzbuoizzjwgekuhot' }}"
          echo "Triggered by: ${{ github.actor }} on commit ${{ github.sha }}"
          echo "=========================================================="

          if [ -z "${{ secrets.SUPABASE_ACCESS_TOKEN }}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is missing! Please configure it in Repository Secrets."
            exit 1
          fi

          if [ -z "${{ secrets.SUPABASE_DB_PASSWORD }}" ]; then
            echo "::error::SUPABASE_DB_PASSWORD is missing! Please configure it in Repository Secrets."
            exit 1
          fi

          echo "✔ Secret validation passed. Proceeding with migration."

      - name: 3. Set Up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: 4. Verify CLI Installation
        run: |
          echo "Supabase CLI Version:"
          supabase --version
          echo "✔ Supabase CLI is ready."

      - name: 5. Link Project to Supabase
        run: |
          echo "Connecting to remote Supabase project: $SUPABASE_PROJECT_ID..."
          supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"
          echo "✔ Successfully linked project $SUPABASE_PROJECT_ID."
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID || 'fvpfzbuoizzjwgekuhot' }}

      - name: 6. Push Database Migrations
        run: |
          echo "Applying pending migrations to Supabase database..."
          supabase db push --password "$SUPABASE_DB_PASSWORD"
          echo "✔ Database migrations applied successfully."
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: 7. Publish Migration Summary
        if: always()
        run: |
          echo "### 🚀 Supabase Migration Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Project ID**: \`${{ secrets.SUPABASE_PROJECT_ID || 'fvpfzbuoizzjwgekuhot' }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered By**: @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ job.status == 'success' && '✅ Migrations Successfully Applied' || '❌ Migration Failed' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All migrations located in \`supabase/migrations/\` have been synchronized with your live Supabase database." >> $GITHUB_STEP_SUMMARY
