name: Zerodha Daily Portfolio Auto-Sync

# Automated daily Zerodha login & sync runs on Vercel Schedules (`bom1` Mumbai):
#   - 09:30 AM IST daily (`daily-automation` -> /api/v1/automation/cron)
#   - 03:45 PM IST Mon-Fri (`zerodha-post-market-sync` -> /api/v1/integrations/zerodha/cron)
# Keep this workflow manual-only (`workflow_dispatch`) to avoid duplicate logins from US runners
# and failing scheduled runs when GitHub Actions secrets are not provisioned.
on:
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab when GitHub secrets are configured

jobs:
  zerodha-daily-sync:
    name: Zerodha Kite Headless Auto-Login & Portfolio Sync
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Zerodha Automated Headless Login & Portfolio Sync
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ZERODHA_API_KEY: ${{ secrets.ZERODHA_API_KEY }}
          ZERODHA_API_SECRET: ${{ secrets.ZERODHA_API_SECRET }}
          ZERODHA_USER_ID: ${{ secrets.ZERODHA_USER_ID }}
          ZERODHA_PASSWORD: ${{ secrets.ZERODHA_PASSWORD }}
          ZERODHA_TOTP_SECRET: ${{ secrets.ZERODHA_TOTP_SECRET }}
          ZERODHA_AUTHORIZED_USER_ID: ${{ secrets.ZERODHA_AUTHORIZED_USER_ID }}
          ENCRYPTION_MASTER_KEY: ${{ secrets.ENCRYPTION_MASTER_KEY }}
        run: npx --yes tsx scripts/zerodhaAutoSync.ts
