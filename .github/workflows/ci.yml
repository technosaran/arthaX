name: CI / Production Quality Gate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-quality-and-typecheck:
    name: Code Quality & TypeScript Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: TypeScript Typecheck
        run: npm run typecheck

      - name: ESLint Check
        run: npm run lint

  frontend-backend-tests:
    name: Vitest & Next.js Unit / Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Execute Vitest Suite
        env:
          NODE_ENV: test
          SUPABASE_SERVICE_ROLE_KEY: test-service-role-key-for-unit-tests-only-min-32-chars
          ENCRYPTION_MASTER_KEY: test-encryption-master-key-must-be-at-least-32-chars!
        run: npm test

  python-calculation-engine-tests:
    name: Python Financial Calculation Engine (AFCE) Pytest Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest hypothesis fastapi pydantic uvicorn httpx

      - name: Execute Pytest Suite
        run: python -m pytest --maxfail=5

  production-build-gate:
    name: Next.js Production Build Gate
    runs-on: ubuntu-latest
    needs: [code-quality-and-typecheck, frontend-backend-tests, python-calculation-engine-tests]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Build Next.js Application
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://dummy-supabase-project.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key-for-static-analysis-and-build
          SUPABASE_SERVICE_ROLE_KEY: dummy-service-role-key-for-build
          ENCRYPTION_MASTER_KEY: dummy-encryption-master-key-32-chars-gate!
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run build
