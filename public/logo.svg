<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <!-- Vibrant Fintech Gradients -->
    <linearGradient id="gradApex" x1="20" y1="20" x2="100" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF3366"/>
      <stop offset="50%" stop-color="#FF6B00"/>
      <stop offset="100%" stop-color="#FFD600"/>
    </linearGradient>

    <linearGradient id="gradBladeLeft" x1="20" y1="30" x2="90" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F5D4"/>
      <stop offset="50%" stop-color="#00BBF9"/>
      <stop offset="100%" stop-color="#4361EE"/>
    </linearGradient>

    <linearGradient id="gradBladeRight" x1="100" y1="30" x2="30" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7209B7"/>
      <stop offset="50%" stop-color="#F72585"/>
      <stop offset="100%" stop-color="#FF007F"/>
    </linearGradient>

    <linearGradient id="gradCore" x1="50" y1="55" x2="70" y2="75" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#00F5D4"/>
    </linearGradient>

    <linearGradient id="bgPlate" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#14141E"/>
      <stop offset="100%" stop-color="#06060A"/>
    </linearGradient>

    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Modern Dark Plate Container -->
  <rect x="3" y="3" width="114" height="114" rx="26" fill="url(#bgPlate)" stroke="#27273A" stroke-width="2"/>

  <!-- Left Dynamic Blade (Cyan to Electric Blue) -->
  <path d="M30 92L82 34C84 32 87 32 89 34L92 37C94 39 94 42 92 44L40 102C38 104 35 104 33 102L30 99C28 97 28 94 30 92Z" 
        fill="url(#gradBladeLeft)" filter="url(#glowEffect)"/>

  <!-- Right Dynamic Blade (Violet to Hot Pink) -->
  <path d="M90 92L38 34C36 32 33 32 31 34L28 37C26 39 26 42 28 44L80 102C82 104 85 104 87 102L90 99C92 97 92 94 90 92Z" 
        fill="url(#gradBladeRight)" filter="url(#glowEffect)"/>

  <!-- Apex Summit "A" Chevron (Sunset Coral to Radiant Gold) -->
  <path d="M60 18L88 56H72L60 38L48 56H32L60 18Z" 
        fill="url(#gradApex)" filter="url(#glowEffect)"/>

  <!-- Core Prism Diamond Node -->
  <polygon points="60,54 70,66 60,78 50,66" fill="url(#gradCore)"/>
  <circle cx="60" cy="66" r="3" fill="#FFFFFF"/>
</svg>
