<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Offline | arthaX</title>
  <meta name="description" content="You are currently offline. Cached portfolio views and local data remain accessible until your connection is restored.">
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192x192.png">
  <link rel="apple-touch-icon" sizes="192x192" href="/icon-192x192.png">
  <meta name="theme-color" content="#07080c">
  <style>
    :root {
      --bg: #07080c;
      --card: #0d0f16;
      --border: rgba(255, 255, 255, 0.09);
      --fg: #ffffff;
      --muted: #94a3b8;
      --accent: #10b981;
      --accent-hover: #34d399;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f8fafc;
        --card: #ffffff;
        --border: #cbd5e1;
        --fg: #0f172a;
        --muted: #64748b;
        --accent: #059669;
        --accent-hover: #047857;
      }
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: var(--bg);
      color: var(--fg);
      font-family: var(--font);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }
    .offline-card {
      background-color: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 36px 28px;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.45);
      position: relative;
      overflow: hidden;
    }
    .glow-orb {
      position: absolute;
      top: -40px;
      left: 50%;
      transform: translateX(-50%);
      width: 160px;
      height: 160px;
      background: radial-gradient(circle, rgba(16, 185, 129, 0.25) 0%, transparent 70%);
      pointer-events: none;
    }
    .logo-container {
      width: 64px;
      height: 64px;
      margin: 0 auto 20px;
      border-radius: 18px;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      background: rgba(245, 158, 11, 0.15);
      color: #f59e0b;
      border: 1px solid rgba(245, 158, 11, 0.3);
      margin-bottom: 16px;
    }
    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #f59e0b;
    }
    h1 {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 10px;
    }
    p {
      font-size: 14px;
      line-height: 1.55;
      color: var(--muted);
      margin-bottom: 24px;
    }
    .btn-retry {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 13px 20px;
      background-color: var(--accent);
      color: #ffffff;
      font-size: 14px;
      font-weight: 700;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-decoration: none;
    }
    .btn-retry:hover {
      background-color: var(--accent-hover);
      transform: translateY(-1px);
    }
    .btn-retry:active {
      transform: scale(0.98);
    }
    .hint {
      margin-top: 16px;
      font-size: 12px;
      color: var(--muted);
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <div class="offline-card">
    <div class="glow-orb"></div>
    <div class="logo-container">
      <svg width="34" height="34" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M50 14 L84 50 L50 86 L16 50 Z" stroke="#10b981" stroke-width="3" stroke-opacity="0.8" fill="none"/>
        <path d="M50 20 L24 76 H38 L50 48 L62 76 H76 L50 20 Z" fill="#ffffff"/>
        <path d="M78 26 L22 74 H36 L78 38 V26 Z" fill="#10b981"/>
        <path d="M74 74 L46 48 L56 38 L84 64 V74 H74 Z" fill="#10b981"/>
      </svg>
    </div>

    <div class="status-badge">
      <span class="status-dot"></span>
      Network Disconnected
    </div>

    <h1>You are currently offline</h1>
    <p>
      ArthaX requires an internet connection to decrypt live banking feeds, stream stock tickers, and synchronize encrypted financial telemetry.
    </p>

    <button type="button" class="btn-retry" onclick="checkConnection()">
      Reconnect to ArthaX
    </button>

    <div class="hint">
      Cached session data will resume automatically once connectivity returns.
    </div>
  </div>

  <script>
    function checkConnection() {
      if (navigator.onLine) {
        window.location.reload();
      } else {
        var btn = document.querySelector('.btn-retry');
        var originalText = btn.innerText;
        btn.innerText = 'Still offline... Checking';
        btn.style.opacity = '0.7';
        setTimeout(function() {
          btn.innerText = originalText;
          btn.style.opacity = '1';
        }, 1500);
      }
    }
    window.addEventListener('online', function() {
      window.location.reload();
    });
  </script>
</body>
</html>
