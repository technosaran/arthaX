<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="favPlateGrad" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#131922"/>
      <stop offset="100%" stop-color="#080b0f"/>
    </linearGradient>

    <linearGradient id="favGreenGrad" x1="20" y1="20" x2="90" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="favSilverGrad" x1="20" y1="80" x2="80" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="60%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>

    <linearGradient id="favCoreGlow" x1="50" y1="40" x2="50" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
  </defs>

  <!-- Rounded Base Tile -->
  <rect x="2" y="2" width="96" height="96" rx="22" fill="url(#favPlateGrad)" stroke="rgba(255, 255, 255, 0.2)" stroke-width="2"/>

  <!-- Outer Geometric Precision Rhombus Accent -->
  <path d="M50 14 L84 50 L50 86 L16 50 Z" stroke="url(#favGreenGrad)" stroke-width="2" stroke-opacity="0.45" fill="none"/>

  <!-- Left Apex Blade: 'A' Left Stroke (Silver/Platinum) -->
  <path d="M50 20 L24 76 H38 L50 48 L62 76 H76 L50 20 Z" fill="url(#favSilverGrad)"/>

  <!-- Interlocking Dynamic 'X' Blade (Neon Emerald) -->
  <path d="M78 26 L22 74 H36 L78 38 V26 Z" fill="url(#favGreenGrad)"/>
  <path d="M74 74 L46 48 L56 38 L84 64 V74 H74 Z" fill="url(#favGreenGrad)"/>

  <!-- Precision Horizontal Crossbar & Core Prism -->
  <path d="M36 58 H64 L59 50 H41 L36 58 Z" fill="url(#favCoreGlow)"/>

  <!-- Apex Summit Light Point -->
  <circle cx="50" cy="20" r="3" fill="#FFFFFF"/>
</svg>
