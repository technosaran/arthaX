<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Squircle Plate Gradient -->
    <radialGradient id="plateRadial" cx="50%" cy="35%" r="75%" fx="50%" fy="25%">
      <stop offset="0%" stop-color="#141E2E"/>
      <stop offset="55%" stop-color="#0B111D"/>
      <stop offset="100%" stop-color="#05080E"/>
    </radialGradient>

    <!-- Outer Rim Stroke Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.35)"/>
      <stop offset="40%" stop-color="rgba(52, 211, 153, 0.4)"/>
      <stop offset="70%" stop-color="rgba(16, 185, 129, 0.15)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.08)"/>
    </linearGradient>

    <!-- Sovereign Emerald Glow Gradient -->
    <linearGradient id="emeraldGlow" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#6EE7B7"/>
      <stop offset="35%" stop-color="#34D399"/>
      <stop offset="70%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Deep Emerald Shadow Gradient -->
    <linearGradient id="emeraldDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#064E3B"/>
    </linearGradient>

    <!-- Brushed Platinum / Titanium Blade Gradient -->
    <linearGradient id="titaniumBlade" x1="20%" y1="80%" x2="80%" y2="20%">
      <stop offset="0%" stop-color="#CBD5E1"/>
      <stop offset="30%" stop-color="#F8FAFC"/>
      <stop offset="65%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>

    <!-- Polished Silver Highlight Gradient -->
    <linearGradient id="silverHighlight" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>

    <!-- Center Radiant Core Filter / Glow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <radialGradient id="ambientAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.32"/>
      <stop offset="60%" stop-color="#059669" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Ambient Backdrop Aura Glow -->
  <circle cx="256" cy="256" r="210" fill="url(#ambientAura)"/>

  <!-- Master Squircle Container (App Icon Base) -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#plateRadial)" stroke="url(#rimGrad)" stroke-width="3"/>

  <!-- Subtle Inner Bevel Line -->
  <rect x="22" y="22" width="468" height="468" rx="106" fill="none" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1.5"/>

  <!-- Geometric Precision Vault Rhombus Guide -->
  <polygon points="256,64 432,256 256,448 80,256" fill="none" stroke="url(#emeraldGlow)" stroke-width="2.5" stroke-opacity="0.35" stroke-dasharray="6 6"/>

  <!-- Subtle Diamond Core Field -->
  <polygon points="256,92 404,256 256,420 108,256" fill="rgba(16, 185, 129, 0.04)" stroke="rgba(52, 211, 153, 0.2)" stroke-width="1"/>

  <!-- === The arthaX Monogram: Interlocking 'A' and 'X' === -->

  <!-- Left Apex Pillar: Titanium 'A' Ascending Wing -->
  <path d="M256 100 L124 388 H196 L256 244 L316 388 H388 L256 100 Z" fill="url(#titaniumBlade)"/>

  <!-- Inner Diamond Cutout for 'A' Apex -->
  <path d="M256 182 L210 286 H302 L256 182 Z" fill="#0B111D"/>

  <!-- Forward Slanted Dynamic Blade: 'X' Emerald Strike -->
  <path d="M398 128 L114 378 H186 L410 188 V128 H398 Z" fill="url(#emeraldGlow)" filter="url(#softGlow)"/>

  <!-- Counter-Balance Emerald Wing -->
  <path d="M380 378 L236 248 L288 198 L432 328 V378 H380 Z" fill="url(#emeraldDark)"/>

  <!-- Central Precision Core Prism / Crossbar -->
  <polygon points="184,296 328,296 304,256 208,256" fill="url(#silverHighlight)"/>

  <!-- Jewel Facet Top Glow -->
  <circle cx="256" cy="100" r="14" fill="#FFFFFF"/>
  <circle cx="256" cy="100" r="28" fill="#34D399" fill-opacity="0.45" filter="url(#softGlow)"/>

  <!-- Micro Precision Coordinates for Sovereign High-Tech Branding -->
  <circle cx="256" cy="276" r="4" fill="#10B981"/>
</svg>